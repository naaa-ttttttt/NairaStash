[package]
name = "savings_app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"
reqwest = { version = "0.13.5", features = ["json"] }
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
dotenvy = "0.15.7"
serde_json = "1.0.154"
subtle = { version = "2.6.1", features = ["std"] }
uuid = "1.29.1"
chrono = { version = "0.4.45", features = ["serde"] }
