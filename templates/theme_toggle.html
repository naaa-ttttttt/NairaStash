<button type="button" onclick="toggleTheme()" aria-label="Switch theme" title="Switch theme"
  class="card size-10 rounded-full shrink-0 flex items-center justify-center text-ink hover:bg-sunken transition-colors">
  <span class="[html[data-theme=light]_&]:hidden"><span class="material-symbols-outlined text-[20px]">light_mode</span></span>
  <span class="hidden [html[data-theme=light]_&]:block"><span class="material-symbols-outlined text-[20px]">dark_mode</span></span>
</button>
