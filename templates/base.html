<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="htmx-config" content='{"globalViewTransitions":true}'>
  <title>{% block title %}NairaStash{% endblock %}</title>

  <script>
    // runs before the page paints, so the wrong theme never flashes
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          theme = saved;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();

    // the theme button on the profile page calls this
    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* roles: the values live in the CSS variables below and change with the theme */
            page: "rgb(var(--page) / <alpha-value>)",
            surface: "rgb(var(--surface) / <alpha-value>)",
            sunken: "rgb(var(--sunken) / <alpha-value>)",
            line: "rgb(var(--line) / <alpha-value>)",
            ink: "rgb(var(--ink) / <alpha-value>)",
            muted: "rgb(var(--muted) / <alpha-value>)",
            accent: "rgb(var(--accent) / <alpha-value>)",
            "on-accent": "rgb(var(--on-accent) / <alpha-value>)",
            mint: "rgb(var(--mint) / <alpha-value>)",
            danger: "rgb(var(--danger) / <alpha-value>)",

            /* legacy: only for pages we have not rewritten yet, delete when all pages are done */
            lime: { DEFAULT: "#D8F13A", ink: "#10301C" },
            azure: "#2F7CF6",
            warn: "#FFC247",
            forest: { 950: "#081811", 900: "#0B1F14", 800: "#12301F", 700: "#1D4A30" }
          },
          fontFamily: { sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"] }
        }
      }
    }
  </script>

  <style>
    /* dark theme, the default. Each value is three numbers: red green blue */
    :root {
      --page: 11 31 20;
      --surface: 18 48 31;
      --sunken: 14 39 24;
      --line: 29 74 48;
      --ink: 242 245 239;
      --muted: 157 181 165;
      --accent: 242 245 239;
      --on-accent: 11 31 20;
      --mint: 143 214 168;
      --danger: 242 139 130;
      color-scheme: dark;
    }

    /* light theme: the same roles with different values */
    html[data-theme="light"] {
      --page: 244 246 242;
      --surface: 255 255 255;
      --sunken: 238 242 238;
      --line: 221 229 222;
      --ink: 11 31 20;
      --muted: 91 111 98;
      --accent: 11 31 20;
      --on-accent: 255 255 255;
      --mint: 31 122 69;
      --danger: 179 38 30;
      color-scheme: light;
    }

    html {
      min-height: 100%;
      background-color: rgb(var(--page));
    }

    body { font-variant-numeric: tabular-nums; }

    /* legacy card classes, mapped to the roles so old pages keep working */
    .glass {
      background: rgb(var(--surface));
      border: 1px solid rgb(var(--line));
    }
    .glass-dark {
      background: rgb(var(--sunken));
      border: 1px solid rgb(var(--line));
    }

    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
    .fill-1 { font-variation-settings: 'FILL' 1, 'wght' 400; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { display: none; }
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .15s; }
  </style>

  <style type="text/tailwindcss">
    /* shared pieces: change one here and every page follows */
    @layer components {
      .app-header { @apply sticky top-0 z-30 flex items-center px-5 h-16 bg-page border-b border-line; }
      .card { @apply bg-surface border border-line rounded-xl; }
      .card-inset { @apply bg-sunken border border-line rounded-xl; }
      .btn-primary { @apply flex items-center justify-center gap-2 h-12 px-5 rounded-xl bg-accent text-on-accent font-semibold transition-opacity hover:opacity-90; }
      .btn-quiet { @apply flex items-center justify-center gap-2 h-12 px-5 rounded-xl bg-surface text-ink border border-line font-medium transition-colors hover:bg-sunken; }
    }
  </style>

  <script>
    // htmx skips 4xx responses by default, this lets a 400 form error page show up
    document.addEventListener('htmx:beforeSwap', function (event) {
      if (event.detail.xhr.status === 400) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
    });
  </script>
</head>

<body hx-boost="true" class="text-ink antialiased {% block body_class %}pb-28{% endblock %}">
  <div class="mx-auto max-w-md w-full min-h-screen flex flex-col relative">

    {% block content %}{% endblock %}

  </div>

  {% block nav %}
  <!-- Bottom tab bar: full width and solid, so nothing shows through it -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-surface border-t border-line">
    <div class="mx-auto max-w-md h-20 px-5 flex items-center justify-between">
      <a href="/" aria-label="Home" title="Home"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "home" %}bg-line text-ink{% else %}text-muted hover:text-ink{% endif %}">
        <span class="material-symbols-outlined text-[22px]">dashboard</span>
      </a>
      <a href="/plans" aria-label="Plans" title="Plans"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "plans" %}bg-line text-ink{% else %}text-muted hover:text-ink{% endif %}">
        <span class="material-symbols-outlined text-[22px]">savings</span>
      </a>
      <a href="/groups" aria-label="Groups" title="Groups"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "groups" %}bg-line text-ink{% else %}text-muted hover:text-ink{% endif %}">
        <span class="material-symbols-outlined text-[22px]">diversity_3</span>
      </a>
      <a href="/activity" aria-label="Activity" title="Activity"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "activity" %}bg-line text-ink{% else %}text-muted hover:text-ink{% endif %}">
        <span class="material-symbols-outlined text-[22px]">receipt_long</span>
      </a>
      <a href="/profile" aria-label="Profile" title="Profile"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "profile" %}bg-line text-ink{% else %}text-muted hover:text-ink{% endif %}">
        <span class="material-symbols-outlined text-[22px]">manage_accounts</span>
      </a>
    </div>
  </nav>
  {% endblock %}
</body>
</html>
