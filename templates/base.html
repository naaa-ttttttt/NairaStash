<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="htmx-config" content='{"globalViewTransitions":true}'>
  <title>{% block title %}NairaStash{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lime: { DEFAULT: "#D8F13A", ink: "#10301C" },
            /* azure and warn stay for now so unfinished pages don't break, we remove them page by page */
            azure: "#2F7CF6",
            warn: "#FFC247",
            /* 950 darkest, 900 page background, 800 surfaces (cards, nav), 700 borders */
            forest: { 950: "#081811", 900: "#0B1F14", 800: "#12301F", 700: "#1D4A30" }
          },
          fontFamily: { sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"] }
        }
      }
    }
  </script>
  <style>
    /* one flat colour behind everything, no gradient layer */
    html {
      min-height: 100%;
      background-color: #0B1F14;
    }

    body { font-variant-numeric: tabular-nums; }

    /* solid cards: a flat colour slightly lighter than the page, plus a 1px border */
    .glass {
      background: #12301F;
      border: 1px solid #1D4A30;
    }
    .glass-dark {
      background: #0E2718;
      border: 1px solid #1D4A30;
    }

    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
    .fill-1 { font-variation-settings: 'FILL' 1, 'wght' 400; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { display: none; }
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .15s; }
  </style>

  <script>
    // htmx skips 4xx responses by default, this lets a 400 form error page show up
    document.addEventListener('htmx:beforeSwap', function (event) {
      if (event.detail.xhr.status === 400) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
    });
  </script>
</head>

<body hx-boost="true" class="text-white antialiased {% block body_class %}pb-28{% endblock %}">
  <div class="mx-auto max-w-md w-full min-h-screen flex flex-col relative">

    {% block content %}{% endblock %}

  </div>

  {% block nav %}
  <!-- Bottom tab bar: full width and solid, so nothing shows through it -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-forest-800 border-t border-forest-700">
    <div class="mx-auto max-w-md h-20 px-5 flex items-center justify-between">
      <a href="/" aria-label="Home" title="Home"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "home" %}bg-forest-700 text-white{% else %}text-white/60 hover:text-white{% endif %}">
        <span class="material-symbols-outlined text-[22px]">dashboard</span>
      </a>
      <a href="/plans" aria-label="Plans" title="Plans"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "plans" %}bg-forest-700 text-white{% else %}text-white/60 hover:text-white{% endif %}">
        <span class="material-symbols-outlined text-[22px]">savings</span>
      </a>
      <a href="/groups" aria-label="Groups" title="Groups"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "groups" %}bg-forest-700 text-white{% else %}text-white/60 hover:text-white{% endif %}">
        <span class="material-symbols-outlined text-[22px]">diversity_3</span>
      </a>
      <a href="/activity" aria-label="Activity" title="Activity"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "activity" %}bg-forest-700 text-white{% else %}text-white/60 hover:text-white{% endif %}">
        <span class="material-symbols-outlined text-[22px]">receipt_long</span>
      </a>
      <a href="/profile" aria-label="Profile" title="Profile"
         class="size-12 rounded-xl flex items-center justify-center transition-colors {% if active == "profile" %}bg-forest-700 text-white{% else %}text-white/60 hover:text-white{% endif %}">
        <span class="material-symbols-outlined text-[22px]">manage_accounts</span>
      </a>
    </div>
  </nav>
  {% endblock %}
</body>
</html>
